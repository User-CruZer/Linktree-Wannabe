<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Pricelist | Cruzer</title>
  <meta name="description" content="Cruzer piloting service pricelist. All prices in IDR.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Pricelist | Cruzer">
  <meta property="og:description" content="Cruzer piloting service pricelist. All prices in IDR.">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#f4ecdd" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d0b09" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%231a1712' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71'/%3E%3Cpath d='M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="profile.js"></script>
  <script src="pricelist.js"></script>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("linkhub.theme");
        var preferred = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        var configured = window.PROFILE && window.PROFILE.theme;
        var fallback = configured === "light" || configured === "dark" ? configured : preferred;
        document.documentElement.dataset.theme = saved === "light" || saved === "dark" ? saved : fallback;
      } catch (error) {}
    })();
  </script>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <span class="blob blob-1"></span>
    <span class="blob blob-2"></span>
    <span class="blob blob-3"></span>
  </div>

  <a id="backBtn" class="back-btn" href="index.html" aria-label="Back to profile" title="Back"></a>
  <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle color theme"></button>

  <main class="card">
    <header class="profile">
      <h1 id="priceTitle" class="name">Pricelist</h1>
      <p id="priceNote" class="bio"></p>
    </header>

    <nav id="priceJump" class="price-jump" aria-label="Jump to category" hidden></nav>

    <div id="priceGroups" class="price-groups"></div>

    <footer class="actions">
      <a id="orderBtn" class="btn action-btn" target="_blank" rel="noopener noreferrer" hidden></a>
    </footer>
  </main>

  <dialog id="preview" class="preview" aria-label="Service preview">
    <figure>
      <img id="previewImg" alt="">
      <figcaption id="previewCaption"></figcaption>
    </figure>
  </dialog>

  <script src="pricelist-page.js"></script>
</body>
</html>
